name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests
        run: pytest -v

  notebook:
    # Executes the walkthrough end to end on the real M5 data (downloads ~50 MB).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cache M5 download
        uses: actions/cache@v4
        with:
          path: data/raw
          key: m5-cc704ba15d68
      - name: Execute notebook
        run: jupyter nbconvert --to notebook --execute notebooks/walkthrough.ipynb --output /tmp/walkthrough_out.ipynb --ExecutePreprocessor.timeout=900
